<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌸 Cute Corner</title>
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #fce4ec 0%, #f8e8ff 50%, #e8f5e9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ── Floating particles ── */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.5;
            animation: floatUp linear infinite;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(110vh) rotate(0deg) scale(0.6);
                opacity: 0.3;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        /* ── Main card ── */
        .card {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 60px 60px 60px 60px;
            padding: 40px 45px 50px;
            box-shadow:
                0 20px 60px rgba(233, 150, 200, 0.25),
                0 8px 24px rgba(255, 182, 193, 0.20),
                inset 0 1px 4px rgba(255, 255, 255, 0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-4px) scale(1.005);
            box-shadow:
                0 28px 72px rgba(233, 150, 200, 0.30),
                0 10px 32px rgba(255, 182, 193, 0.25);
        }

        /* ── Decorative top ── */
        .deco-top {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .deco-top span {
            font-size: 2.2rem;
            display: inline-block;
            animation: wobble 3s ease-in-out infinite alternate;
        }

        .deco-top span:nth-child(2) {
            animation-delay: 0.3s;
        }
        .deco-top span:nth-child(3) {
            animation-delay: 0.6s;
        }
        .deco-top span:nth-child(4) {
            animation-delay: 0.9s;
        }
        .deco-top span:nth-child(5) {
            animation-delay: 1.2s;
        }

        @keyframes wobble {
            0% {
                transform: translateY(0) rotate(-3deg);
            }
            100% {
                transform: translateY(-8px) rotate(3deg);
            }
        }

        /* ── Avatar / Mascot ── */
        .mascot {
            font-size: 5.2rem;
            line-height: 1.2;
            margin: 4px 0 8px;
            display: inline-block;
            animation: bounceMascot 2.4s ease-in-out infinite;
            filter: drop-shadow(0 8px 18px rgba(255, 150, 200, 0.30));
            cursor: default;
            transition: transform 0.2s ease;
        }

        .mascot:hover {
            animation-play-state: paused;
            transform: scale(1.12) rotate(-6deg);
        }

        @keyframes bounceMascot {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-16px) scale(1.04);
            }
        }

        /* ── Typography ── */
        h1 {
            font-size: 3.4rem;
            font-weight: 700;
            color: #6a3e5a;
            letter-spacing: -0.5px;
            margin: 2px 0 4px;
            background: linear-gradient(135deg, #b86b8a, #d47b9e, #b86b8a);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 5s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .subtitle {
            font-size: 1.15rem;
            font-weight: 500;
            color: #7a5a6e;
            background: rgba(255, 220, 235, 0.5);
            display: inline-block;
            padding: 6px 24px;
            border-radius: 100px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin: 2px 0 16px;
            letter-spacing: 0.3px;
        }

        .subtitle span {
            display: inline-block;
            animation: sparkle 1.8s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #5a4a5a;
            max-width: 540px;
            margin: 6px auto 18px;
            font-weight: 400;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin: 18px 0 22px;
        }

        .divider-line {
            flex: 1;
            max-width: 100px;
            height: 2.5px;
            border-radius: 4px;
            background: linear-gradient(90deg, transparent, #f5b8d0, transparent);
        }

        .divider-icon {
            font-size: 1.5rem;
            opacity: 0.7;
        }

        /* ── Feature icons ── */
        .features {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px 32px;
            margin: 18px 0 26px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 500;
            color: #6a4a5e;
            background: rgba(255, 245, 248, 0.6);
            padding: 6px 18px 6px 14px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            transition: all 0.25s ease;
            cursor: default;
        }

        .feature-item:hover {
            background: rgba(255, 230, 240, 0.8);
            transform: scale(1.04) translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 150, 200, 0.20);
        }

        .feature-item .icon {
            font-size: 1.4rem;
        }

        /* ── Buttons ── */
        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin: 12px 0 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 34px;
            border-radius: 100px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #6a3e5a;
            box-shadow: 0 6px 20px rgba(200, 130, 170, 0.20);
            text-decoration: none;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
        }

        .btn-primary {
            background: linear-gradient(145deg, #f8c8d8, #f5b8d0);
            color: #4a2a3e;
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 6px 24px rgba(235, 150, 190, 0.30);
        }

        .btn-primary:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 36px rgba(235, 150, 190, 0.40);
            background: linear-gradient(145deg, #fcd0e0, #f7c0d8);
        }

        .btn-primary:active {
            transform: scale(0.96) translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(6px);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 28px rgba(200, 130, 170, 0.15);
        }

        .btn .btn-icon {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .btn:hover .btn-icon {
            transform: rotate(6deg) scale(1.1);
        }

        /* ── Footer / extra cute ── */
        .footer-cute {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: #8a6a7e;
            font-weight: 400;
        }

        .footer-cute .hearts {
            font-size: 1.2rem;
            animation: pulseHeart 1.6s ease-in-out infinite;
        }

        @keyframes pulseHeart {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.25);
            }
        }

        .footer-cute a {
            color: #b86b8a;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 2px dotted rgba(184, 107, 138, 0.3);
            transition: border-color 0.3s ease;
        }

        .footer-cute a:hover {
            border-color: #b86b8a;
        }

        /* ── Click surprise ── */
        .surprise-area {
            margin-top: 14px;
            font-size: 1.6rem;
            min-height: 3.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .surprise-area .surprise-emoji {
            display: inline-block;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0.4);
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.4) rotate(-12deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .card {
                padding: 28px 20px 36px;
                border-radius: 40px;
            }
            h1 {
                font-size: 2.4rem;
            }
            .mascot {
                font-size: 4rem;
            }
            .subtitle {
                font-size: 0.95rem;
                padding: 4px 18px;
            }
            p {
                font-size: 0.95rem;
            }
            .features {
                gap: 12px 20px;
            }
            .feature-item {
                font-size: 0.9rem;
                padding: 4px 14px 4px 10px;
            }
            .btn {
                padding: 12px 26px;
                font-size: 0.95rem;
            }
            .deco-top span {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 20px 14px 28px;
                border-radius: 32px;
            }
            h1 {
                font-size: 2rem;
            }
            .mascot {
                font-size: 3.2rem;
            }
            .btn {
                padding: 10px 20px;
                font-size: 0.85rem;
                width: 100%;
                justify-content: center;
            }
            .actions {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Floating Particles ─── -->
    <div class="particles" id="particles" aria-hidden="true"></div>

    <!-- ─── Main Card ─── -->
    <main class="card" role="main">

        <!-- Decorative top -->
        <div class="deco-top">
            <span>🌸</span>
            <span>🌷</span>
            <span>✨</span>
            <span>🌼</span>
            <span>🍬</span>
        </div>

        <!-- Mascot -->
        <div class="mascot" role="img" aria-label="Cute mascot character">🧸</div>

        <!-- Heading -->
        <h1>Hello, cutie!</h1>

        <div class="subtitle">
            <span>✨</span> &nbsp;welcome to the cozy corner&nbsp; <span>✨</span>
        </div>

        <p>
            This is a little slice of happiness made just for you.
            Take a deep breath, smile, and enjoy the sweetness. 💖
        </p>

        <!-- Divider -->
        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-icon">🐻</span>
            <span class="divider-line"></span>
        </div>

        <!-- Feature icons -->
        <div class="features">
            <span class="feature-item">
                <span class="icon">☁️</span> Soft &amp; fluffy
            </span>
            <span class="feature-item">
                <span class="icon">🌈</span> Rainbow vibes
            </span>
            <span class="feature-item">
                <span class="icon">🍭</span> Sweet &amp; playful
            </span>
            <span class="feature-item">
                <span class="icon">💫</span> Magical
            </span>
        </div>

        <!-- Buttons -->
        <div class="actions">
            <button class="btn btn-primary" id="surpriseBtn">
                <span class="btn-icon">🎁</span>
                Surprise me!
            </button>
            <button class="btn btn-secondary" id="resetBtn">
                <span class="btn-icon">🔄</span>
                Reset
            </button>
        </div>

        <!-- Surprise output -->
        <div class="surprise-area" id="surpriseArea" aria-live="polite">
            <!-- dynamic emojis appear here -->
        </div>

        <!-- Footer -->
        <div class="footer-cute">
            <span class="hearts">💗</span>
            made with love &bull;
            <a href="#" onclick="event.preventDefault();">hug me</a>
            &bull; <span class="hearts">💗</span>
        </div>

    </main>

    <script>
        // ─── Floating particles ───
        (function createParticles() {
            const container = document.getElementById('particles');
            const emojis = ['🌸', '🌷', '✨', '🌼', '🍬', '💖', '🌟', '🍭', '🌈', '🧁', '🎀', '🐇', '🦋', '🍀', '🌺'];
            const count = 28;

            for (let i = 0; i < count; i++) {
                const span = document.createElement('span');
                span.className = 'particle';
                span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                span.style.left = Math.random() * 100 + '%';
                span.style.fontSize = (1.2 + Math.random() * 2.0) + 'rem';
                span.style.animationDuration = (14 + Math.random() * 22) + 's';
                span.style.animationDelay = (Math.random() * 20) + 's';
                span.style.opacity = 0.25 + Math.random() * 0.35;
                container.appendChild(span);
            }
        })();

        // ─── Surprise logic ───
        const surpriseBtn = document.getElementById('surpriseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const surpriseArea = document.getElementById('surpriseArea');

        const surpriseSets = [
            ['🎉', '🎊', '🥳', '💖', '✨'],
            ['🐣', '🐥', '🌻', '☀️', '🌿'],
            ['🍩', '🍪', '🧁', '🍫', '🍭'],
            ['🌈', '🦄', '🌟', '☁️', '💫'],
            ['🐱', '🐶', '🐰', '🦊', '🐼'],
            ['🌸', '🌺', '🌷', '🌹', '🌼'],
            ['💜', '💗', '💙', '💚', '💛'],
            ['🧸', '🎀', '🎈', '🎁', '🍬'],
        ];

        let currentSurprise = null;

        function showSurprise() {
            // pick a random set
            const set = surpriseSets[Math.floor(Math.random() * surpriseSets.length)];
            // shuffle and pick 3–5
            const shuffled = [...set].sort(() => Math.random() - 0.5);
            const count = 3 + Math.floor(Math.random() * 3);
            const chosen = shuffled.slice(0, count);

            // clear with a tiny fade
            surpriseArea.innerHTML = '';
            // add each with staggered pop
            chosen.forEach((emoji, idx) => {
                const span = document.createElement('span');
                span.className = 'surprise-emoji';
                span.textContent = emoji;
                span.style.animationDelay = (idx * 0.08) + 's';
                surpriseArea.appendChild(span);
            });

            // also update mascot for extra fun
            const mascot = document.querySelector('.mascot');
            const mascotEmojis = ['🧸', '🐣', '🐰', '🦄', '🐱', '🐶', '🌸', '⭐', '🌈', '🍭', '🎈', '🧁'];
            const newMascot = mascotEmojis[Math.floor(Math.random() * mascotEmojis.length)];
            mascot.textContent = newMascot;
            // reset animation by re-adding class
            mascot.style.animation = 'none';
            void mascot.offsetHeight; // trigger reflow
            mascot.style.animation = 'bounceMascot 2.4s ease-in-out infinite';

            currentSurprise = chosen;
        }

        function resetSurprise() {
            surpriseArea.innerHTML = '';
            const mascot = document.querySelector('.mascot');
            mascot.textContent = '🧸';
            mascot.style.animation = 'none';
            void mascot.offsetHeight;
            mascot.style.animation = 'bounceMascot 2.4s ease-in-out infinite';
            currentSurprise = null;
        }

        surpriseBtn.addEventListener('click', showSurprise);
        resetBtn.addEventListener('click', resetSurprise);

        // ─── Extra: click on mascot triggers surprise ───
        document.querySelector('.mascot').addEventListener('click', showSurprise);

        // ─── Keyboard shortcut: press 's' for surprise ───
        document.addEventListener('keydown', (e) => {
            if (e.key === 's' || e.key === 'S') {
                if (!e.ctrlKey && !e.metaKey && !e.altKey) {
                    e.preventDefault();
                    showSurprise();
                }
            }
            if (e.key === 'r' || e.key === 'R') {
                if (!e.ctrlKey && !e.metaKey && !e.altKey) {
                    e.preventDefault();
                    resetSurprise();
                }
            }
        });

        // ─── Show a welcome surprise after 1.2s ───
        setTimeout(() => {
            showSurprise();
        }, 1200);

        console.log('🌸 Cute corner loaded! Press S for surprise, R to reset.');
    </script>

</body>
</html>
